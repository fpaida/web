<!DOCTYPE html>
<html>
<head>

<body>

    <nav>
        <a href="index.html">Home / View Data</a>

        <a href="modify.html">Modify Existing Data</a>
    </nav>

    <div class="container">

    <h2>Add New Grocery</h2>

    <form id="addGroceryForm">
        <label>Product Name:</label><br>
        <input type="text" id="product_name" required><br><br>

        <label>Category:</label><br>
        <input type="text" id="category" required><br><br>

        <label>Price:</label><br>
        <input type="text" id="price" required><br><br>

        <label>Quantity:</label><br>
        <input type="text" id="quantity" required><br><br>

        <button type="submit">Add Grocery</button>
    </form>

</div>

    <script src="./js/postGroceries.js"></script>

</body>
</html>
