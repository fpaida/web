<!DOCTYPE html>
<html>

<head>
    <title>Modify Grocery</title>
    <link href="./stylesheets/hometheme.css" rel="stylesheet">
</head>

<body>

    <nav>
        <a href="index.html">Home / View Data</a>
        <a href="add.html">Add New Data</a>
        <a href="modify.html">Modify Existing Data</a>
    </nav>

    <div class="container">

        <h2>Modify Existing Grocery</h2>

        <form id="modifyGroceryForm">

            <label>Product ID:</label><br>
            <input type="text" id="product_id" required><br><br>

            <label>Product Name:</label><br>
            <input type="text" id="product_name" required><br><br>

            <label>Category:</label><br>
            <input type="text" id="category" required><br><br>

            <label>Price:</label><br>
            <input type="text" id="price" required><br><br>

            <label>Quantity:</label><br>
            <input type="text" id="quantity" required><br><br>

            <button type="submit">Update Grocery</button>

        </form>

    </div>

    <script src="./js/putGroceries.js"></script>

</body>

</html>
